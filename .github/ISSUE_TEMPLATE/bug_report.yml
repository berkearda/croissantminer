name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Please do not paste API keys.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `croissantminer --version` and `python --version`, and your operating system
    validations:
      required: true
