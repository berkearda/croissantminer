name: New system or model
description: Propose an extraction system or model, or share results on the benchmark (see leaderboard/README.md)
labels: ["new system"]
body:
  - type: textarea
    id: system
    attributes:
      label: The system
      description: Architecture, model and a link to the code or paper
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Scores from `make evaluate` on the development or test split, if you have them (see leaderboard/README.md)
