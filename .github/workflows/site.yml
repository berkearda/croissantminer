name: site

# Builds the leaderboard website from leaderboard/leaderboard.csv and publishes it on GitHub Pages
# (https://berkearda.github.io/croissantminer/) whenever the leaderboard or the site changes on main.
on:
  push:
    branches: [main]
    paths:
      - "leaderboard/**"
      - "site/**"
      - "assets/**"
      - "scripts/build_site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
