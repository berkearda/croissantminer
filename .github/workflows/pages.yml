name: Leaderboard site

# Builds site/ from leaderboard/leaderboard.csv and publishes it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["leaderboard/**", "site/**", "scripts/build_site.py", "scripts/leaderboard_table.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
