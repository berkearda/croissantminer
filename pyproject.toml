[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "croissantminer"
version = "0.2.0"
description = "Extract Croissant metadata, including the Responsible AI fields, from ML dataset papers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Berke Arda", email = "bearda@ethz.ch"},
]
keywords = ["machine-learning", "metadata", "croissant", "responsible-ai", "datasets", "llm", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Enough to extract metadata; the extras add the Croissant check, the paper's evaluation and the demo.
dependencies = [
    "anthropic>=0.72.0,<1",  # 1.x drops the temperature setting the systems use
    "openai>=1.76.0,<2",
    "PyPDF2>=3.0.1",
    "requests",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
validate = [
    "mlcroissant>=1.0,<2",
]
# Reproducing the paper's numbers and figures. The exact versions used for the paper are in requirements.txt.
eval = [
    "pandas>=2.0.3",
    "pyarrow>=14.0",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1.0",
    "regex",
    "PyMuPDF>=1.24.0",
]
demo = [
    "gradio>=6.14,<7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
croissantminer = "croissantminer.cli:main"

[project.urls]
Homepage = "https://github.com/berkearda/croissantminer"
Demo = "https://huggingface.co/spaces/bearda/croissantminer"
Dataset = "https://huggingface.co/datasets/bearda/croissantminer"
Issues = "https://github.com/berkearda/croissantminer/issues"
Changelog = "https://github.com/berkearda/croissantminer/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["croissantminer*"]

[tool.pytest.ini_options]
# tests/: scorer rules, output handling and the Table 2 reproduction check.
# validation/test_experiments.py covers early experiments and needs local PDFs.
testpaths = ["tests", "validation/test_metrics.py"]
