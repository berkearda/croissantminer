[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "croissantminer"
version = "0.1.0"
description = "Automated metadata extraction for ML datasets using the Croissant RAI schema"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Berke Arda", email = "bearda@ethz.ch"},
]
keywords = ["machine-learning", "metadata", "croissant", "responsible-ai", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.72.0",
    "openai>=1.76.0",
    "google-generativeai",
    "PyPDF2>=3.0.1",
    "PyMuPDF>=1.24.0",
    "regex",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "pandas>=2.0.3",
    "pyarrow>=14.0",
    "openpyxl>=3.1.0",
    "requests",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
croissantminer = "croissantminer.cli:main"

[project.urls]
Homepage = "https://github.com/berkearda/croissantminer"
Repository = "https://github.com/berkearda/croissantminer"
Issues = "https://github.com/berkearda/croissantminer/issues"

[tool.setuptools.packages.find]
include = ["croissantminer*"]

[tool.pytest.ini_options]
# tests/: scorer rules, output handling and the Table 2 reproduction check.
# validation/test_experiments.py covers early experiments and needs local PDFs.
testpaths = ["tests", "validation/test_metrics.py"]
