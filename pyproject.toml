[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "croissantminer"
version = "0.1.0"
description = "Automated metadata extraction for ML datasets using the Croissant RAI schema"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Berke Arda", email = "bearda@ethz.ch"},
]
keywords = ["machine-learning", "metadata", "croissant", "responsible-ai", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "PyMuPDF>=1.24.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.scripts]
croissantminer = "croissantminer.cli:main"

[project.urls]
Homepage = "https://github.com/croissantminer/croissantminer"
Documentation = "https://github.com/croissantminer/croissantminer/blob/main/docs/REPRODUCTION.md"
Repository = "https://github.com/croissantminer/croissantminer"
Issues = "https://github.com/croissantminer/croissantminer/issues"

[tool.setuptools.packages.find]
include = ["croissantminer*"]
